name: Build

# 只在打 v* 标签（或手动触发）时构建发布，普通 push 不跑
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发时退回 pubspec 里的版本
            V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      # 固定签名：与本地同一把密钥，云包可直接覆盖安装
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "!! secrets 未配置，回退 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS_VAL
          storeFile=upload-keystore.jks
          EOF
          echo "keystore restored"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 Gradle 依赖（AGP/Kotlin 编译器等，避免每次全量下载触发 504）
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename artifacts
        run: |
          V="${{ steps.ver.outputs.version }}"
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk   "../../../../qq_music_ai-${V}-android-arm64.apk"
          cp app-armeabi-v7a-release.apk "../../../../qq_music_ai-${V}-android-armeabi-v7a.apk"
          cp app-x86_64-release.apk      "../../../../qq_music_ai-${V}-android-x86_64.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            qq_music_ai-*android-arm64.apk
            qq_music_ai-*android-armeabi-v7a.apk
            qq_music_ai-*android-x86_64.apk

  build-windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release `
            --build-name="${{ steps.ver.outputs.version }}" `
            --build-number="${{ github.run_number }}"

      - name: Zip bundle
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "qq_music_ai-${v}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: qq_music_ai-*windows-x64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apk-release/*.apk
            artifacts/windows-release/*.zip
          generate_release_notes: true
