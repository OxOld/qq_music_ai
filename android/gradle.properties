org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=60000

# audio_service/just_audio_background 运行时按资源名解析通知小图标（ic_notification），
# release 默认的 aapt2 optimize 会混淆资源名导致 getIdentifier 失效，
# 通知无 small icon 直接 IllegalArgumentException 闪退。
android.enableResourceOptimizations=false
